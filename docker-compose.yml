services:
  honeypot:
    build: honeypot
    image: ghcr.io/maede97/honeypot:latest
    restart: always
    environment:
      HONEYPOT_DB_PATH: /data/honeypot.db
      RETENTION_DAYS: ${RETENTION_DAYS:-7}
      RETENTION_SCHEDULE_HOUR: ${RETENTION_SCHEDULE_HOUR:-0}
      RETENTION_SCHEDULE_MINUTE: ${RETENTION_SCHEDULE_MINUTE:-30}
    env_file:
      - .env
    volumes:
      - ./honeypot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  honeypot-gui:
    build: honeypot-gui
    image: ghcr.io/maede97/honeypot-gui:latest
    restart: always
    environment:
      HONEYPOT_DB_PATH: /data/honeypot.db
      GUI_ADMIN_USERNAME: ${GUI_ADMIN_USERNAME}
      GUI_ADMIN_PASSWORD_BCRYPT: ${GUI_ADMIN_PASSWORD_BCRYPT}
      GUI_SESSION_SECRET: ${GUI_SESSION_SECRET}
    env_file:
      - .env
    volumes:
      - ./honeypot-data:/data:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
