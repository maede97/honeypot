services:
  honeypot:
    build: honeypot
    image: ghcr.io/maede97/honeypot:latest
    restart: always
    env_file:
      - .env
    volumes:
      - ./honeypot-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:8000"

  honeypot-gui:
    build: honeypot-gui
    image: ghcr.io/maede97/honeypot-gui:latest
    restart: always
    env_file:
      - .env
    volumes:
      - ./honeypot-data:/data:ro
      - ./honeypot-gui-data:/gui-data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "8001:8001"