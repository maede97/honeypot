<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Honeypot GUI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 font-sans text-slate-100 antialiased">
    <div class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
      <div class="absolute left-0 top-0 h-80 w-80 rounded-full bg-sky-400/20 blur-3xl"></div>
      <div class="absolute right-0 top-1/3 h-[22rem] w-[22rem] rounded-full bg-cyan-400/10 blur-3xl"></div>
    </div>

    <main class="grid min-h-screen place-items-center px-4 py-10">
      <section class="w-full max-w-md rounded-2xl border border-slate-700 bg-slate-900/80 p-6 shadow-2xl shadow-black/30">
      <h1 class="text-3xl font-bold text-white">Honeypot Login</h1>
      <p class="mt-2 text-sm text-slate-300">Sign in to inspect scanner traffic.</p>

      {% if error %}
      <p class="mt-4 rounded-lg border border-rose-400/50 bg-rose-400/20 px-3 py-2 text-sm font-medium text-red-200">{{ error }}</p>
      {% endif %}

      <form method="post" action="/login" class="mt-5 grid gap-4">
        <label class="grid gap-1.5 text-xs font-semibold uppercase tracking-[0.16em] text-slate-300">
          Username
          <input
            type="text"
            name="username"
            required
            class="rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-100 outline-none transition focus:border-sky-400"
          />
        </label>
        <label class="grid gap-1.5 text-xs font-semibold uppercase tracking-[0.16em] text-slate-300">
          Password
          <input
            type="password"
            name="password"
            required
            class="rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-sm text-slate-100 outline-none transition focus:border-sky-400"
          />
        </label>
        <button
          type="submit"
          class="mt-1 rounded-xl border border-sky-400/60 bg-sky-400/20 px-4 py-2.5 text-sm font-semibold text-sky-400 transition hover:bg-sky-400/30"
        >
          Sign in
        </button>
      </form>
      </section>
    </main>
  </body>
</html>
